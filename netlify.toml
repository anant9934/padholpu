# ─────────────────────────────────────────────────────────────────
# Netlify Configuration — PADHO LPU
# ─────────────────────────────────────────────────────────────────

[build]
  # Run the full build (vite client + esbuild server bundle)
  command   = "npm run build"
  # Vite outputs the client to dist/public (see vite.config.ts)
  publish   = "dist/public"
  # Netlify Functions directory
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION          = "20"
  # Keep NODE_ENV=production for the app runtime, but allow devDeps to install
  NODE_ENV              = "production"
  # Tell npm to install devDependencies (needed for vite, tsc, esbuild at build time)
  NPM_CONFIG_PRODUCTION = "false"
  # Force Netlify to use npm even if a pnpm-lock.yaml was previously cached
  NPM_FLAGS             = "--legacy-peer-deps"
  # Omit non-secret env vars from Netlify's secrets scanner.
  # NODE_ENV ("production"), APP_URL (public site URL), SMTP_HOST (smtp.gmail.com),
  # SMTP_USER / EMAIL_FROM / GMAIL_USER (public contact email), and PORT (5000)
  # are all non-sensitive values that appear throughout source code and docs.
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER,SMTP_USER,EMAIL_FROM,NODE_ENV,APP_URL,SMTP_HOST,SMTP_PORT,PORT"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
# ── Functions ──────────────────────────────────────────────────────
[functions]
  # Bundle each function with esbuild for faster cold starts
  node_bundler = "esbuild"
  # Allow up to 26 s for DB queries + seeding on cold starts (Netlify max is 26s)
  included_files = ["shared/**", "server/**"]


# ── Redirects ──────────────────────────────────────────────────────

# 0. Domain 301 Migration Redirects (padholpu.info & studylpu.online -> padholpu.online)
[[redirects]]
  from   = "https://padholpu.info/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://padholpu.info/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://padhlolpu.online/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://padhlolpu.online/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://padhlolpu.info/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://padhlolpu.info/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://studylpu.online/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://studylpu.online/*"
  to     = "https://padholpu.online/:splat"
  status = 301
  force  = true

# 1. Proxy all /api/* requests to the Netlify Function.
#    The function path shim handles the /api prefix compatibility.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# 2. Legacy AI Subsystem Redirects (Permanent 301)
[[redirects]]
  from   = "/ai-exam-generator"
  to     = "/exams"
  status = 301

[[redirects]]
  from   = "/ai-exam/*"
  to     = "/exams"
  status = 301

[[redirects]]
  from   = "/ai-tutor"
  to     = "/learn"
  status = 301

[[redirects]]
  from   = "/qwen-ai"
  to     = "/learn"
  status = 301

# 2b. Academic Route Aliases (Permanent 301)
[[redirects]]
  from   = "/library"
  to     = "/learn"
  status = 301

[[redirects]]
  from   = "/notes"
  to     = "/resources?type=Notes"
  status = 301

[[redirects]]
  from   = "/study-material"
  to     = "/learn"
  status = 301

[[redirects]]
  from   = "/previous-year-papers"
  to     = "/resources?type=Past+Paper"
  status = 301

[[redirects]]
  from   = "/pyq"
  to     = "/resources?type=Past+Paper"
  status = 301

[[redirects]]
  from   = "/syllabus"
  to     = "/subjects"
  status = 301

# 3. SPA fallback — serve index.html for any unmatched route
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://challenges.cloudflare.com https://www.googletagmanager.com https://*.google.com https://*.google https://*.adtrafficquality.google https://*.googlesyndication.com https://*.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com https://pagead2.googlesyndication.com https://*.google.com https://*.google https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google https://*.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.cloudinary.com https://*.google.com https://*.google https://*.adtrafficquality.google https://*.googlesyndication.com https://*.doubleclick.net https://pagead2.googlesyndication.com; frame-src 'self' https://www.youtube.com https://challenges.cloudflare.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://*.googlesyndication.com https://*.google.com https://*.google https://*.adtrafficquality.google; form-action 'self' https://accounts.google.com; base-uri 'self'; frame-ancestors 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Dev proxy (netlify dev) ─────────────────────────────────────────
[dev]
  command   = "npm run dev"
  port      = 5000
  targetPort = 5000
  autoLaunch = false
