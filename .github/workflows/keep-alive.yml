name: Render Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier web service from spinning down
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  heartbeat:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL || 'https://padholpu-backend.onrender.com/health' }}"
          echo "Pinging keep-alive endpoint: ${TARGET_URL}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${TARGET_URL}" || echo "000")
          echo "HTTP Response Code: ${HTTP_CODE}"
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 301 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Keep-alive successful: Render web service is awake and healthy."
          else
            echo "⚠️ Health probe returned code ${HTTP_CODE}. Service may be waking up from cold start."
          fi
