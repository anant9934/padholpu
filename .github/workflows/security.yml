name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

jobs:
  security-scan:
    name: Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit (SCA)
        id: dependency_audit
        run: npm audit --audit-level=high
        # Continue so typecheck, tests, and builds still produce useful results.
        # A final gate below keeps high-severity findings release-blocking.
        continue-on-error: true

      - name: TypeScript Type Check
        run: npm run check

      - name: Run Unit & Security Test Suites
        run: npm run test:unit
        env:
          RUN_LIVE_DB_TESTS: 'false'
          NODE_ENV: test
          JWT_SECRET: test_ci_jwt_secret_must_be_sufficiently_long_and_complex_12345
          ADMIN_PASSCODE: test_ci_admin_passcode_for_security_suite_verification

      - name: Verify Decoupled Frontend Build (Vercel Target)
        run: npm run build:client

      - name: Verify Decoupled Backend Build (Render Target)
        run: npm run build:server

      - name: Verify Full Production Build
        run: npm run build

      - name: Repository Secret & Sensitive File Verification
        run: |
          echo "Verifying no local .env files or credentials are tracked in Git..."
          ! git ls-files | grep -E '(^\.env$|^\.env\.local$|^\.env\.production$|\.pem$|\.key$)' || (echo "Sensitive file committed!" && exit 1)
          echo "Repository integrity verified: zero sensitive files tracked."

      - name: Enforce dependency audit release gate
        if: always() && steps.dependency_audit.outcome == 'failure'
        run: |
          echo "High-severity dependency advisories remain. Resolve them before release."
          exit 1
      
  codeql-analysis:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
